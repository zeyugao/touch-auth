name: Update Homebrew Tap

on:
  release:
    types:
      - published

permissions:
  contents: read

env:
  HOMEBREW_TAP_REPOSITORY: zeyugao/homebrew-touch-auth

jobs:
  update-homebrew:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out source repository
        uses: actions/checkout@v4

      - name: Prepare scripts
        run: chmod +x scripts/*.sh

      - name: Resolve release asset and checksum
        id: asset
        shell: bash
        run: |
          set -euo pipefail

          asset_url="https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/touch-auth.tar.gz"
          archive_path="/tmp/touch-auth.tar.gz"

          for attempt in {1..10}; do
            if curl -fsSL "$asset_url" -o "$archive_path"; then
              break
            fi

            if [[ "$attempt" -eq 10 ]]; then
              echo "Failed to download $asset_url" >&2
              exit 1
            fi

            sleep 3
          done

          sha256="$(sha256sum "$archive_path" | awk '{print $1}')"

          echo "url=$asset_url" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Check out Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HOMEBREW_TAP_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-touch-auth

      - name: Update formula
        env:
          HOMEBREW_FORMULA_PATH: homebrew-touch-auth/Formula/touch-auth.rb
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
          RELEASE_ASSET_URL: ${{ steps.asset.outputs.url }}
          RELEASE_SHA256: ${{ steps.asset.outputs.sha256 }}
          HOMEPAGE_URL: https://github.com/${{ github.repository }}
        run: scripts/update-homebrew-formula.sh

      - name: Commit and push formula
        working-directory: homebrew-touch-auth
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Formula already matches release ${{ github.event.release.tag_name }}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/touch-auth.rb
          git commit -m "touch-auth ${{ github.event.release.tag_name }}"
          git push
