name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit release version (x.y.z). Leave empty to use bump."
        required: false
        type: string
      bump:
        description: "Version part to bump when version is empty."
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare scripts
        run: chmod +x scripts/*.sh

      - name: Determine release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="${{ inputs.version }}"
          if [[ -z "$version" ]]; then
            version="$(scripts/next-version.sh "${{ inputs.bump }}")"
          fi

          version="${version#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must match x.y.z" >&2
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "Tag $version already exists" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release archive
        run: scripts/build-release-archive.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" dist/touch-auth.tar.gz \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes "Automated release for version ${{ steps.version.outputs.version }}"
